<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Atom Merge</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:#111122;transition:background 1.5s ease}

    /* ── Starfield ── */
    #starfield {
      position:fixed;top:0;left:0;width:100%;height:100%;
      z-index:4;pointer-events:none;opacity:0.4;
    }

    /* ── Ambient background blobs ── */
    .bg-blob{
      position:fixed;border-radius:50%;pointer-events:none;
      filter:blur(100px);opacity:0.18;z-index:5;
      will-change:transform;
      transition:background 1.5s ease;
    }
    .bg-blob:nth-of-type(1){width:45vw;height:45vw;background:#6644ff;top:-10%;left:-10%;animation:drift1 38s ease-in-out infinite alternate}
    .bg-blob:nth-of-type(2){width:55vw;height:55vw;background:#22ddaa;bottom:-15%;right:-15%;animation:drift2 44s ease-in-out infinite alternate}
    .bg-blob:nth-of-type(3){width:40vw;height:40vw;background:#ff4488;top:40%;left:50%;animation:drift3 50s ease-in-out infinite alternate}
    .bg-blob:nth-of-type(4){width:50vw;height:50vw;background:#ffaa22;bottom:20%;left:-20%;animation:drift4 42s ease-in-out infinite alternate}
    .bg-blob:nth-of-type(5){width:35vw;height:35vw;background:#4488ff;top:10%;right:10%;animation:drift5 46s ease-in-out infinite alternate}

    @keyframes drift1{0%{transform:translate(0,0) scale(1)}100%{transform:translate(12vw,15vh) scale(1.15)}}
    @keyframes drift2{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-14vw,-12vh) scale(1.1)}}
    @keyframes drift3{0%{transform:translate(0,0) scale(0.9)}100%{transform:translate(-10vw,18vh) scale(1.2)}}
    @keyframes drift4{0%{transform:translate(0,0) scale(1.1)}100%{transform:translate(16vw,-10vh) scale(0.95)}}
    @keyframes drift5{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-8vw,14vh) scale(1.12)}}
    body{font-family:system-ui,-apple-system,sans-serif;color:#ddddf0}

    /* ── Canvas ── */
    #renderCanvas{width:100%;height:100%;display:block;touch-action:none;outline:none;position:relative;z-index:6;background:transparent}

    /* ── Header bar ── */
    #hud{
      position:fixed;top:0;left:50%;transform:translateX(-50%);
      display:flex;align-items:center;flex-wrap:wrap;
      padding:6px 12px;gap:8px;
      background:rgba(10,10,25,0.92);
      border-bottom:1px solid rgba(255,255,255,0.06);
      border-radius:0 0 10px 10px;
      pointer-events:none;z-index:10;
      width:calc(100% - 12px);max-width:600px;
      box-sizing:border-box;
    }
    /* Row grouping */
    .hud-row{display:flex;align-items:center;gap:8px;width:100%}
    .hud-row-top{justify-content:space-between}
    .hud-row-bot{justify-content:space-between}
    .hud-left{display:flex;align-items:center;gap:6px;flex-shrink:0}
    .hud-right{display:flex;align-items:center;gap:4px;flex-shrink:0}
    .hud-center{display:flex;align-items:center;gap:4px;flex:1;justify-content:center;min-width:0;overflow:hidden}
    #hud>*{pointer-events:auto}
    .hud-score{display:flex;align-items:center;gap:5px;white-space:nowrap}
    .hud-score .icon{font-size:15px;opacity:0.8}
    .hud-score .val{font-size:17px;font-weight:700}
    .hud-best{font-size:10px;opacity:0.45;white-space:nowrap}
    .hud-best .bv{font-weight:700;opacity:0.7}
    .hud-btn{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:6px;color:#b0b0cc;font-size:13px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}
    .hud-btn:hover{background:rgba(255,255,255,0.12)}

    #hud-energy{display:flex;align-items:center;gap:5px;flex:1;min-width:0}
    #etrk{flex:1 1 0;max-width:180px;min-width:24px;height:8px;background:rgba(255,255,255,0.08);border-radius:4px;overflow:hidden}
    #energy-fill{height:100%;width:100%;background:linear-gradient(90deg,#f5a623,#f7c948);border-radius:4px;transition:width .3s}
    #hud-energy .e-icon{font-size:14px}
    #hud-energy .e-val{font-size:13px;font-weight:700;color:#f7c948;min-width:22px}

    @media(max-width:480px){
      #hud{padding:4px 8px;gap:4px}
      .hud-row{gap:5px}
      .hud-score .val{font-size:14px}
      .hud-score .icon{font-size:13px}
      .hud-best{display:none}
      .hud-btn{width:24px;height:24px;font-size:12px}
      #hud-energy .e-val{font-size:11px;min-width:18px}
      #hud-energy .e-icon{font-size:12px}
      #etrk{height:6px;max-width:100px}
    }
    @media(max-width:360px){
      #hud{padding:3px 6px;gap:3px}
      .hud-score .val{font-size:12px}
      #etrk{max-width:60px}
      #server-status{display:none}
    }

    /* cfg-toggle now uses .hud-btn class */

    /* ── Config panel ── */
    #cfg{
      position:fixed;right:0;top:48px;bottom:0;width:156px;
      background:rgba(6,6,15,0.93);
      border-left:1px solid rgba(255,255,255,0.06);
      padding:14px 10px;font-size:11px;z-index:20;overflow-y:auto;
      transition:transform .25s ease;
    }
    #cfg.hidden{transform:translateX(100%);pointer-events:none;opacity:0}
    .ct{font-size:9px;text-transform:uppercase;letter-spacing:1.4px;opacity:0.38;margin-bottom:10px}
    .cr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
    .cr span{opacity:0.65}
    .cr small{opacity:0.4;min-width:28px;text-align:right;font-size:10px}
    .cr input[type=range]{width:58px;accent-color:#4488ff}
    .cr select{
      background:#10102a;color:#b0b0cc;border:1px solid rgba(255,255,255,0.1);
      padding:3px;font-size:10px;border-radius:3px;width:76px;
    }

    /* ── Game Over ── */
    #game-over{
      position:fixed;inset:0;display:none;flex-direction:column;
      align-items:center;justify-content:center;
      background:rgba(6,6,15,0.88);z-index:50;gap:12px;
    }
    #game-over h1{font-size:34px;color:#ff5533}
    #game-over p{font-size:18px;opacity:0.75}
    #rbtn{
      margin-top:6px;padding:10px 26px;background:#3355ee;border:none;
      border-radius:6px;color:#fff;font-size:14px;font-weight:600;cursor:pointer;
    }

    /* ── Arcade Scoreboard ──────────────────────── */
    #scoreboard-overlay{
      position:fixed;inset:0;display:none;flex-direction:column;
      align-items:center;justify-content:center;
      background:rgba(6,6,15,0.92);z-index:55;gap:0;
    }
    .sb-box{
      background:rgba(0,0,0,0.7);border:2px solid #ffcc00;border-radius:12px;
      padding:24px 32px;min-width:300px;max-width:380px;text-align:center;
      box-shadow:0 0 30px rgba(255,204,0,0.15);
    }
    .sb-title{
      font-size:22px;font-weight:900;color:#ffcc00;letter-spacing:3px;
      text-transform:uppercase;margin-bottom:4px;
      text-shadow:0 0 8px rgba(255,204,0,0.5);
    }
    .sb-subtitle{font-size:11px;opacity:0.4;margin-bottom:16px}
    .sb-table{width:100%;border-collapse:collapse;margin:8px 0}
    .sb-table td{padding:4px 6px;font-size:14px;font-family:'Courier New',monospace}
    .sb-table .sb-rank{width:30px;color:#ffcc00;text-align:center;font-weight:700}
    .sb-table .sb-name{color:#44ddff;letter-spacing:2px;font-weight:700;text-align:center;width:60px}
    .sb-table .sb-pts{text-align:right;color:#fff;font-weight:600}
    .sb-table .sb-world{font-size:11px;opacity:0.4;text-align:left;padding-left:8px}
    .sb-table tr.sb-highlight td{color:#ff5;text-shadow:0 0 6px rgba(255,255,80,0.5)}
    .sb-empty{font-size:13px;opacity:0.35;padding:20px 0}
    .sb-close{
      margin-top:16px;padding:8px 24px;background:transparent;border:1px solid #ffcc00;
      border-radius:6px;color:#ffcc00;font-size:13px;cursor:pointer;letter-spacing:1px;
    }
    .sb-close:hover{background:rgba(255,204,0,0.1)}

    /* ── Name Entry ──────────────────────── */
    #name-entry{
      position:fixed;inset:0;display:none;flex-direction:column;
      align-items:center;justify-content:center;
      background:rgba(6,6,15,0.92);z-index:60;gap:0;
    }
    .ne-box{
      background:rgba(0,0,0,0.7);border:2px solid #ff5533;border-radius:12px;
      padding:28px 36px;text-align:center;
      box-shadow:0 0 30px rgba(255,85,51,0.2);
    }
    .ne-title{font-size:20px;font-weight:900;color:#ff5533;letter-spacing:2px;margin-bottom:2px}
    .ne-score{font-size:32px;font-weight:900;color:#ffcc00;margin:8px 0;text-shadow:0 0 10px rgba(255,204,0,0.4)}
    .ne-prompt{font-size:13px;opacity:0.5;margin-bottom:16px}
    .ne-letters{display:flex;gap:12px;justify-content:center;margin:12px 0 20px}
    .ne-letter{
      width:48px;height:56px;background:rgba(255,255,255,0.05);border:2px solid #ffcc00;
      border-radius:8px;display:flex;align-items:center;justify-content:center;
      font-size:32px;font-weight:900;color:#44ddff;font-family:'Courier New',monospace;
      letter-spacing:2px;cursor:pointer;user-select:none;
      text-shadow:0 0 6px rgba(68,221,255,0.5);
    }
    .ne-letter:hover{border-color:#44ddff;background:rgba(68,221,255,0.1)}
    .ne-hint{font-size:10px;opacity:0.3;margin-bottom:12px}
    .ne-ok{
      padding:10px 32px;background:#ffcc00;border:none;border-radius:6px;
      color:#111;font-size:14px;font-weight:800;cursor:pointer;letter-spacing:1px;
    }
    .ne-ok:hover{background:#ffe044}
    .hud-world{display:flex;align-items:center;line-height:1}
    #rbtn:hover{background:#4466ff}

    /* ── Target molecule (clickable in HUD) ── */
    .target-mol{
      cursor:pointer;pointer-events:auto;
      padding:4px 10px;border-radius:10px;
      background:rgba(255,204,0,0.1);
      border:1px solid rgba(255,204,0,0.2);
      transition:all 0.3s;
      animation:target-pulse 2.5s ease-in-out infinite;
      -webkit-tap-highlight-color:rgba(255,204,0,0.3);
      touch-action:manipulation;
      min-height:28px;display:inline-flex;align-items:center;
    }
    .target-mol:hover{
      background:rgba(255,204,0,0.2);
      border-color:rgba(255,204,0,0.4);
      text-shadow:0 0 8px rgba(255,204,0,0.5);
    }
    @keyframes target-pulse{
      0%,100%{border-color:rgba(255,204,0,0.2)}
      50%{border-color:rgba(255,204,0,0.45)}
    }

    /* ── Molecule Info Popup ── */
    #mol-info-popup{
      position:fixed;inset:0;display:none;
      align-items:flex-start;justify-content:center;
      padding-top:60px;
      background:rgba(0,0,15,0.6);
      z-index:200;
      animation:mol-fade-in 0.2s ease;
    }
    @keyframes mol-fade-in{from{opacity:0}to{opacity:1}}

    .mol-popup-card{
      background:rgba(15,15,35,0.95);
      border:1px solid rgba(255,255,255,0.1);
      border-radius:16px;
      padding:24px 28px;
      min-width:260px;max-width:340px;
      backdrop-filter:blur(20px);
      box-shadow:0 8px 40px rgba(0,0,0,0.5), 0 0 60px rgba(100,100,255,0.08);
      animation:mol-slide-in 0.25s ease;
      text-align:center;
    }
    @keyframes mol-slide-in{from{transform:translateY(-15px);opacity:0}to{transform:translateY(0);opacity:1}}

    .mol-popup-header{
      display:flex;align-items:center;justify-content:center;gap:10px;
      margin-bottom:18px;
    }
    .mol-popup-name{
      font-size:22px;font-weight:800;
      background:linear-gradient(135deg,#ffcc00,#ff8800);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
      letter-spacing:0.5px;
    }
    .mol-popup-diff{
      font-size:9px;font-weight:800;letter-spacing:1.5px;
      padding:3px 8px;border-radius:20px;color:#111;
    }

    .mol-popup-atoms{
      display:flex;align-items:center;justify-content:center;gap:8px;
      margin:16px 0;flex-wrap:wrap;
    }
    .mol-atom-ball{
      width:48px;height:48px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      position:relative;
    }
    .mol-atom-sym{
      font-size:18px;font-weight:900;color:#fff;
      text-shadow:0 1px 3px rgba(0,0,0,0.7);
    }
    .mol-plus{
      font-size:20px;font-weight:300;opacity:0.4;
    }

    .mol-popup-hint{
      font-size:12px;opacity:0.5;line-height:1.5;
      margin:12px 0 18px;padding:0 8px;
    }

    .mol-popup-stats{
      display:flex;justify-content:center;gap:24px;
      padding-top:14px;
      border-top:1px solid rgba(255,255,255,0.06);
    }
    .mol-stat{
      display:flex;flex-direction:column;align-items:center;gap:2px;
    }
    .mol-stat-icon{font-size:18px}
    .mol-stat-val{font-size:18px;font-weight:800;color:#fff}
    .mol-stat-label{font-size:9px;text-transform:uppercase;letter-spacing:1px;opacity:0.35}

    /* ── Debug ── */
    #atom-count{position:fixed;bottom:10px;right:166px;font-size:9px;opacity:0.25;z-index:10;pointer-events:none}
  </style>
</head>
<body>
  <canvas id="starfield"></canvas>
  <div class="bg-blob"></div>
  <div class="bg-blob"></div>
  <div class="bg-blob"></div>
  <div class="bg-blob"></div>
  <div class="bg-blob"></div>
  <canvas id="renderCanvas"></canvas>

  <!-- HUD -->
  <div id="hud">
    <!-- Row 1: Score | World/Target | Buttons -->
    <div class="hud-row hud-row-top">
      <div class="hud-left">
        <div class="hud-score"><span class="icon">🏆</span><span class="val" id="score-val">0</span></div>
        <div class="hud-best">BEST <span class="bv" id="best-val">0</span></div>
      </div>
      <div class="hud-center">
        <div class="hud-world" id="hud-world" style="font-size:11px;opacity:0.55;display:flex;align-items:center;line-height:1;flex-wrap:nowrap;gap:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%" title="Current world &amp; target">🌍 W1</div>
      </div>
      <div class="hud-right">
        <span id="server-status" title="Score server" style="font-size:8px;opacity:0.6;cursor:help;display:flex;align-items:center;line-height:1">⏳</span>
        <span class="hud-btn" onclick="openScoreboard()" title="High Scores">📋</span>
        <button id="sfx-toggle" class="hud-btn" onclick="toggleSfx()">🔊</button>
        <button id="cfg-toggle" class="hud-btn" onclick="toggleCfg()">⚙</button>
      </div>
    </div>
    <!-- Row 2: Energy bar -->
    <div class="hud-row hud-row-bot">
      <div id="hud-energy">
        <div id="etrk"><div id="energy-fill"></div></div>
        <span class="e-icon">⚡</span><span class="e-val" id="energy-val">45</span>
        <span id="combo-display" style="font-size:11px;font-weight:700;color:#ff9900;opacity:0;transition:opacity .3s;margin-left:4px"></span>
        <span id="drop-cost" style="font-size:10px;opacity:0.45;margin-left:4px;white-space:nowrap">-1⚡</span>
      </div>
    </div>
  </div>

  <!-- Config panel -->
  <div id="cfg" class="hidden">
    <div class="ct">⚙ Physics Preset</div>
    <div class="cr">
      <span>Gravity</span>
      <input type="range" id="cfg-gravity" min="2" max="25" step="0.5" value="9.81" oninput="updatePhysicsFromUI()">
      <small id="v-gravity">9.8</small>
    </div>
    <div class="cr">
      <span>Bounce</span>
      <input type="range" id="cfg-restitution" min="0" max="0.9" step="0.01" value="0.15" oninput="updatePhysicsFromUI()">
      <small id="v-restitution">0.15</small>
    </div>
    <div class="cr">
      <span>Friction</span>
      <input type="range" id="cfg-friction" min="0" max="1" step="0.05" value="0.5" oninput="updatePhysicsFromUI()">
      <small id="v-friction">0.50</small>
    </div>

    <div class="ct" style="margin-top:14px">⚛ World</div>
    <div class="cr">
      <span>World</span>
      <select id="cfg-world" onchange="setWorldFromUI(this.value)">
        <!-- populated dynamically -->
      </select>
    </div>

    <div class="ct" style="margin-top:14px">⚛ Elements</div>
    <div id="legend"></div>
    <div style="margin-top:16px;text-align:center">
      <button onclick="restartGame();toggleCfg();" style="background:linear-gradient(135deg,#e74c3c,#c0392b);color:#fff;border:none;border-radius:8px;padding:8px 24px;font-size:14px;font-weight:700;cursor:pointer;letter-spacing:0.5px;box-shadow:0 2px 8px rgba(231,76,60,0.4)">🔄 Restart Game</button>
    </div>
  </div>

  <!-- Level-up Toast -->
  <div id="level-toast" style="position:fixed;top:70px;left:50%;transform:translateX(-50%) translateY(-20px);z-index:80;
    background:linear-gradient(135deg,rgba(102,126,234,0.9),rgba(118,75,162,0.9));color:#fff;
    padding:8px 20px;border-radius:20px;font-size:15px;font-weight:700;font-family:Inter,sans-serif;
    opacity:0;transition:opacity 0.4s,transform 0.4s;pointer-events:none;
    box-shadow:0 4px 20px rgba(102,126,234,0.4);white-space:nowrap"></div>

  <!-- World Complete -->
  <div id="world-complete" style="display:none;position:fixed;inset:0;z-index:100;
    background:rgba(0,0,20,0.88);align-items:center;justify-content:center;font-family:Inter,sans-serif">
    <div style="text-align:center;color:#fff;max-width:340px;padding:32px">
      <div style="font-size:56px;margin-bottom:12px">🎉</div>
      <div id="wc-title" style="font-size:26px;font-weight:800;margin-bottom:8px;
        background:linear-gradient(135deg,#667eea,#f093fb);-webkit-background-clip:text;-webkit-text-fill-color:transparent">World Complete!</div>
      <div id="wc-score" style="font-size:16px;opacity:0.6;margin-bottom:28px">Score: 0</div>
      <button id="wc-continue" style="padding:14px 32px;font-size:16px;font-weight:700;
        background:linear-gradient(135deg,#667eea,#764ba2);border:none;color:#fff;border-radius:14px;
        cursor:pointer;box-shadow:0 6px 24px rgba(102,126,234,0.5);transition:transform 0.15s;
        letter-spacing:0.5px" onmouseenter="this.style.transform='scale(1.05)'" onmouseleave="this.style.transform='scale(1)'">Continue →</button>
    </div>
  </div>

  <!-- Molecule Info Popup -->
  <div id="mol-info-popup" style="display:none" onclick="closeMoleculeInfo()"></div>

  <!-- Game Over -->
  <div id="game-over">
    <h1>⚠ Overflow!</h1>
    <p id="final-score">Score: 0</p>
    <button id="rbtn" onclick="restartGame()">Play Again</button>
  </div>

  <!-- Name Entry (arcade 3-letter) -->
  <div id="name-entry">
    <div class="ne-box">
      <div class="ne-title">★ NEW HIGH SCORE ★</div>
      <div class="ne-score" id="ne-score-val">0</div>
      <div class="ne-prompt">ENTER YOUR INITIALS</div>
      <div class="ne-letters">
        <div class="ne-letter" id="ne-l0" onclick="cycleNameLetter(0)">A</div>
        <div class="ne-letter" id="ne-l1" onclick="cycleNameLetter(1)">A</div>
        <div class="ne-letter" id="ne-l2" onclick="cycleNameLetter(2)">A</div>
      </div>
      <div class="ne-hint">TAP letter to cycle • SCROLL to pick</div>
      <button class="ne-ok" onclick="submitHighScore()">OK</button>
    </div>
  </div>

  <!-- Scoreboard -->
  <div id="scoreboard-overlay" onclick="closeScoreboard(event)">
    <div class="sb-box" onclick="event.stopPropagation()">
      <div class="sb-title">🏆 HIGH SCORES</div>
      <div class="sb-subtitle">TOP 10 ALL TIME</div>
      <div id="sb-body"></div>
      <button class="sb-close" onclick="closeScoreboard()">CLOSE</button>
    </div>
  </div>

  <div id="atom-count">atoms: 0</div>

  <script>
    function toggleCfg(){
      var cfg = document.getElementById('cfg');
      cfg.classList.toggle('hidden');
    }
  </script>

  <!-- CDN deps (CSP-safe) -->
  <script src="https://cdn.jsdelivr.net/npm/cannon@0.6.2/build/cannon.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babylonjs@5/babylon.js"></script>
  <!-- Game -->
  <script src="./config.js?v=15"></script>
  <script src="./molecules.js?v=15"></script>
  <script src="./game.js?v=15"></script>
</body>
</html>
